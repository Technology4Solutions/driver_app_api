version: '3.8'
x-vault: &vault
  VAULT_ADDR: ${VAULT_ADDR:-https://vault.reaxium.com}
  VAULT_MOUNT: ${VAULT_MOUNT:-kv}
  VAULT_KV_VERSION: ${VAULT_KV_VERSION:-2}
  VAULT_BASE_PATH: ${VAULT_BASE_PATH:-reaxium_ci/driver_app_api}
  CLIENT: ${CLIENT:?Set CLIENT}
  ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT}
services:
  driver-app-api:
    image: reaxiumapps/driver_app_api:${API_VERSION:?Set API_VERSION}
    environment:
      <<: *vault
      RUST_LOG: info
    secrets: [VAULT_TOKEN]
    ports: ['8080:8080']
    networks: [my_reaxium_api_network]
    stop_grace_period: 30s
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits: {memory: 1G, cpus: '1'}
      update_config:
        parallelism: 1
        delay: 10s
        monitor: 60s
        failure_action: rollback
        order: start-first
      restart_policy: {condition: on-failure, delay: 5s, window: 120s}
  driver-app-rabbitmq:
    image: reaxiumapps/driver_app_api-rabbitmq:${API_VERSION:?Set API_VERSION}
    environment: *vault
    hostname: driver-app-rabbitmq
    secrets: [VAULT_TOKEN]
    volumes: ['driver-app-rabbitmq-data:/var/lib/rabbitmq']
    networks: [my_reaxium_api_network]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_listener', '5672']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      replicas: 1
      placement: {constraints: ['node.role == manager']}
      update_config: {parallelism: 1, order: stop-first, failure_action: rollback}
      restart_policy: {condition: on-failure, delay: 5s}
  driver-app-redis:
    image: redis:7.2-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '512mb', '--maxmemory-policy', 'allkeys-lru']
    volumes: ['driver-app-redis-data:/data']
    networks: [my_reaxium_api_network]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      placement: {constraints: ['node.role == manager']}
      resources:
        limits: {memory: 768M}
      update_config: {parallelism: 1, order: stop-first, failure_action: rollback}
      restart_policy: {condition: on-failure, delay: 5s}
volumes:
  driver-app-rabbitmq-data:
  driver-app-redis-data:
networks:
  my_reaxium_api_network: {external: true}
secrets:
  VAULT_TOKEN: {external: true}
