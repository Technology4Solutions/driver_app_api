version: '3.8'
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ${MONITORING_DIR}/prometheus.generated.yml:/etc/prometheus/prometheus.yml:ro
      - ${MONITORING_DIR}/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [monitoring, api]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      replicas: 1
      placement:
        constraints: ["node.id == ${MONITORING_NODE_ID}"]
      restart_policy: {condition: on-failure}
  grafana:
    image: grafana/grafana:12.1.0
    env_file: ["${MONITORING_ENV_FILE:-/dev/null}"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ${MONITORING_DIR}/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      replicas: 1
      placement:
        constraints: ["node.id == ${MONITORING_NODE_ID}"]
      restart_policy: {condition: on-failure}
networks:
  monitoring:
    driver: overlay
  api:
    external: true
    name: my_reaxium_api_network
volumes:
  prometheus-data:
    name: driver-api-monitoring_prometheus-data
  grafana-data:
    name: driver-api-monitoring_grafana-data
