name: driver-api-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    ports: ["127.0.0.1:9091:9090"]
    volumes:
      - ${PROMETHEUS_CONFIG:-./prometheus.swarm.yml}:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [default, api]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
  grafana:
    env_file:
      - path: ./slack.local.env
        required: false
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
networks:
  api:
    external: true
    name: my_reaxium_api_network
volumes:
  prometheus-data:
  grafana-data:
